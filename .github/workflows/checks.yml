name: checks
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover scripts/tests -v

  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_notes.py knowledge learnings

  change-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_change_file.py --base "origin/${{ github.base_ref }}" --labels "${{ join(github.event.pull_request.labels.*.name, ',') }}"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress '**/*.md'

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r contracts/requirements.txt
      - run: python3 -m unittest discover contracts/tests -v
