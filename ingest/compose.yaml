# Local MQTT broker and time-series DB. From the repo root:
#   cp ingest/.env.example ingest/.env   (then set a password)
#   python3 ingest/devices.py init        (MQTT passwords + ACL)
#   docker compose -f ingest/compose.yaml up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      # the whole folder, so the broker sees passwd/acl after devices.py rewrites them
      - ./mosquitto:/mosquitto/config:ro

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: smartcity
      POSTGRES_USER: smartcity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ingest/.env}
    volumes:
      - ./dev-schema.sql:/docker-entrypoint-initdb.d/10-dev-schema.sql:ro
