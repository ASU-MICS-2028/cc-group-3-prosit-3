# Broker for the simulator (#18) with per-device credentials (#21).
# Listens on all interfaces inside the container; compose.yaml publishes it on localhost:1883 only.
# Create passwd and acl first: python3 ingest/devices.py init
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# ponytail: plain MQTT, so passwords cross the network unencrypted. Fine on localhost;
# add a TLS listener on 8883 before the broker is reachable from the internet (#28).
persistence false
# The default keeps only 1000 queued messages for a client that falls behind and silently drops the rest
# ("Outgoing messages are being dropped for client bridge-1"), so a slow or restarting bridge lost readings (#73).
# 100000 is about 3 h of the 500-sensor pilot (500/min), roughly 30 MB of broker memory.
# ponytail: still in memory only (persistence false): a broker restart loses the queue; turn persistence on with a volume on AWS (#28).
max_queued_messages 100000
log_dest stdout
log_type error
log_type warning
log_type notice
