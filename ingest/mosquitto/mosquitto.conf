# Broker for the simulator (#18) with per-device credentials (#21).
# Listens on all interfaces inside the container; compose.yaml publishes it on localhost:1883 only.
# Create passwd and acl first: python3 ingest/devices.py init
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# ponytail: plain MQTT, so passwords cross the network unencrypted. Fine on localhost;
# add a TLS listener on 8883 before the broker is reachable from the internet (#28).
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
