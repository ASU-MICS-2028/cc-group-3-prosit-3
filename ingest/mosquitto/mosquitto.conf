# Dev broker for the simulator (#18). Listens on all interfaces inside the container;
# compose.yaml publishes it on localhost:1883 only.
# ponytail: anonymous access for local dev only. #21 replaces it with per-device
# passwords (password_file) and an ACL that lets each device publish only to its own topic.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
